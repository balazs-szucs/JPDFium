name: Ghent CMYK

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'native/setup-pdfium.sh'
      - 'native/bridge/src/jpdfium_color.cpp'
      - 'native/bridge/include/jpdfium.h'
      - 'jpdfium/src/main/java/stirling/software/jpdfium/doc/PdfColorConverter.java'
      - 'jpdfium/src/main/java/stirling/software/jpdfium/doc/PdfRecolor.java'
      - 'jpdfium/src/main/java/stirling/software/jpdfium/doc/PdfOutputIntent.java'
      - 'jpdfium/src/main/java/stirling/software/jpdfium/doc/IccCmykTransform.java'
      - 'jpdfium/src/main/java/stirling/software/jpdfium/doc/PdfXConverter.java'
      - 'jpdfium/src/main/java/stirling/software/jpdfium/doc/PdfXOptions.java'
      - 'jpdfium/src/main/java/stirling/software/jpdfium/doc/PdfXStandard.java'
      - 'jpdfium/src/main/java/stirling/software/jpdfium/panama/ColorBindings.java'
      - 'jpdfium/src/test/java/stirling/software/jpdfium/doc/GhentOutputSuiteTest.java'
      - 'jpdfium/src/test/java/stirling/software/jpdfium/doc/PdfXConverterTest.java'
      - '.github/workflows/ghent.yml'

permissions:
  contents: read

concurrency:
  group: ghent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ghent:
    name: Build patched PDFium and run Ghent V50
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@2a69be27b0baa8a7ec1c0ba665dc022b180664c5 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@ecf8cf2dcee84990dee44a7479c2b268de61e38d # v6.3.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libqpdf-dev qpdf unzip
          # Optional: gives PdfXConverterTest a real CMYK profile. It skips
          # cleanly when this package is unavailable.
          sudo apt-get install -y --no-install-recommends icc-profiles-free || true

      - name: Build patched PDFium
        run: bash native/setup-pdfium.sh

      - name: Build JPDFium bridge against patched PDFium
        run: bash native/build-real.sh

      - name: Download Ghent PDF Output Suite V50
        run: |
          curl -fsSL --retry 4 --retry-delay 5 \
            'https://gwg.org/wp-content/uploads/2026/05/Ghent_PDF_Output_Suite_V50_Testpages.zip' \
            -o /tmp/ghent.zip
          unzip -q /tmp/ghent.zip -d /tmp/ghent
          test -f /tmp/ghent/Ghent_PDF_Output_Suite_V50_Testpages/Ghent_PDF-Output-Test-V50_ALL_X4.pdf

      - name: Run Ghent conversion gate
        env:
          GHENT_DIR: /tmp/ghent/Ghent_PDF_Output_Suite_V50_Testpages
        run: |
          ./gradlew :jpdfium:integrationTest \
            --tests 'stirling.software.jpdfium.doc.GhentOutputSuiteTest' \
            --tests 'stirling.software.jpdfium.doc.PdfXConverterTest' \
            --no-daemon --stacktrace

      - name: Upload Ghent output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghent-cmyk-output
          path: |
            /tmp/jpdfium-ghent-cmyk.pdf
            jpdfium/build/reports/tests/integrationTest
          if-no-files-found: ignore
